<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Pessoal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="index.js" defer></script>
</head>

<body>
    <header class="bg-body-tertiary shadow-sm py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="m-0 h4">Yago Dinato</h2>
            <nav>
                <button class="btn btn-outline-success me-2" type="button">About</button>
                <button class="btn btn-outline-success me-2" type="button">Experience</button>
                <button class="btn btn-outline-success me-2" type="button">Projects</button>
                <button class="btn btn-outline-success" type="button">Contact</button>
            </nav>
        </div> 
    </header>

    <main>
        <section class="container my-5">
            <div class="card cartao shadow-lg border-0 rounded-4 p-4 p-md-5">
                <div class="row align-items-center g-4">
                    <div class="col-md-7 col-lg-8">
                        <div class="card-body p-0">
                            <h1 class="display-4 fw-bold mb-3">Olá, meu nome é Yago</h1>
                            <p class="fs-4 fw-normal mb-3" aria-label="Rotating role title">
                                Eu sou um 
                                <span class="d-inline-flex align-items-center">
                                    <span id="rotatorWord" class="fw-bold text-primary">Estudante de ADS</span>
                                    <span id="rotatorCursor" class="border-end border-2 border-dark ms-1 opacity-100">&nbsp;</span>
                                </span>
                            </p>
                            <div class="card-text text-secondary">
                                <p> Sou novo no meio de TI, em busca de novos conhecimentos no mercado e me divertir programando. Estou atrás de descobrir como a tecnologia pode resolver questões do mundo real.</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-5 col-lg-4 text-center">
                        <img src="profile.avif" class="img-fluid rounded-4" alt="imagem-perfil">
                    </div>

                    <div>
                        <!-- BOTOES de GIT,ETC -->
                    </div>

                </div>
            </div>
        </section>
    </main>
</body>
</html>
